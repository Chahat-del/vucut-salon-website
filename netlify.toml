# ── Netlify configuration for vuCut website ──

[build]
  publish   = "."
  functions = "netlify/functions"   # tells Netlify where to find functions

# Redirect /admin to admin.html cleanly
[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# Security headers for admin page
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
